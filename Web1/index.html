<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Colorea la barra de UI del navegador (Android Chrome, algunos
         iOS) para que combine con el fondo de la web en vez de quedar en
         blanco/negro por defecto. Mismo tono que --color-paper. -->
    <meta name="theme-color" content="#fcfaf6">

    <!-- Cabeceras de seguridad reales (frame-ancestors, X-Frame-Options,
         Strict-Transport-Security, cacheo de assets...) van en public/.htaccess
         (Plesk/Apache) -- un <meta> no puede fijarlas. Esta CSP por <meta> es
         una segunda barrera por si el hosting final no llega a aplicar esas
         cabeceras: sin script-src 'unsafe-inline', un <script> inyectado vía
         XSS (p. ej. contenido de WordPress mal saneado) no podría ejecutarse
         igualmente. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://kanbouripsicologia.com https://secure.gravatar.com https://lh3.googleusercontent.com; connect-src 'self' https://kanbouripsicologia.com https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    >

    <!-- Título/descripción por defecto: los ve cualquier rastreador que no
         ejecute JavaScript, y son los que se muestran un instante antes de
         que useSeoMeta() (ver src/composables/useSeoMeta.ts) los sustituya
         por los específicos de cada página ya con datos reales. -->
    <meta
      name="description"
      content="Terapia psicológica en Dénia y la Marina Alta: psicología infantil, adolescentes, adultos y pareja. Sesiones presenciales en Dénia, Jávea y Ondara, y online."
    >
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://kanbouripsicologia.com/">
    <title>Kanbouri Psicología Dénia — Terapia para toda la familia</title>

    <meta property="og:site_name" content="Kanbouri Psicología">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_ES">
    <meta property="og:title" content="Kanbouri Psicología Dénia — Terapia para toda la familia">
    <meta
      property="og:description"
      content="Terapia psicológica en Dénia y la Marina Alta: psicología infantil, adolescentes, adultos y pareja. Sesiones presenciales en Dénia, Jávea y Ondara, y online."
    >
    <meta property="og:url" content="https://kanbouripsicologia.com/">
    <meta property="og:image" content="https://kanbouripsicologia.com/images/logo_kanbouri_2023.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kanbouri Psicología Dénia — Terapia para toda la familia">
    <meta
      name="twitter:description"
      content="Terapia psicológica en Dénia y la Marina Alta: psicología infantil, adolescentes, adultos y pareja. Sesiones presenciales en Dénia, Jávea y Ondara, y online."
    >
    <meta name="twitter:image" content="https://kanbouripsicologia.com/images/logo_kanbouri_2023.png">

    <!-- Datos estructurados (Schema.org): identidad del negocio para
         resultados enriquecidos y para el panel de negocio local de Google
         (dirección, teléfono, horario). Solo datos reales, ya visibles en
         el pie de página — nada inventado (precios, valoraciones falsas...).
         "aggregateRating" se añade aparte en tiempo de ejecución (ver
         GoogleReviews.vue / useAggregateRatingSchema.ts) a partir de las
         reseñas reales de Google que ya se muestran en la portada, para que
         nunca pueda quedar desactualizado ni inventado en este HTML estático.
         id="kb-business-schema" es el gancho que usa ese código para
         localizar y completar este mismo bloque, no uno nuevo. -->
    <script id="kb-business-schema" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalBusiness",
      "name": "Kanbouri Psicología",
      "image": "https://kanbouripsicologia.com/images/logo_kanbouri_2023.png",
      "url": "https://kanbouripsicologia.com/",
      "telephone": "+34629538062",
      "email": "gabinete@kanbouripsicologia.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "C/ Sant Josep 31, Planta Baja Izquierda",
        "addressLocality": "Dénia",
        "addressRegion": "Alicante",
        "addressCountry": "ES"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 38.8386523,
        "longitude": 0.1060985
      },
      "areaServed": ["Dénia", "Jávea", "Ondara", "Marina Alta"],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "12:00",
        "closes": "20:00"
      },
      "sameAs": [
        "https://www.facebook.com/Psicologakanbouri",
        "https://www.instagram.com/kanbouri_psicologia/"
      ]
    }
    </script>

    <!-- El contenido real (API) y la imagen del Hero (candidata a LCP en
         casi todas las páginas) vienen siempre de este mismo dominio:
         adelantar la conexión (DNS + TLS) antes de que el JS la pida de
         verdad ahorra ese tiempo de ida y vuelta en la ruta crítica del
         primer contenido visible. -->
    <link rel="preconnect" href="https://kanbouripsicologia.com">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
